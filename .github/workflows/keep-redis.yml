name: Keep Upstash Alive
on:
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Upstash Redis
        run: |
          curl  -s -X POST ${secrets.UPSTASH_URL} \
          -H "Authorization: Bearer ${secrets.UPSTASH_TOKEN}" \
          -d '["PING"]'